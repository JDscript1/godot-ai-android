name: Godot AI Android

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Android package to build
        type: choice
        default: standard
        options: [standard, ziva-preview]
  push:
    branches: ["ai/android-assistant"]
    paths:
      - "editor/editor_node.cpp"
      - "editor/gui/editor_bottom_panel.*"
      - "editor/project_manager/project_manager.*"
      - "editor/asset_library/editor_asset_installer.*"
      - "scene/main/viewport.*"
      - "modules/ai_assistant/**"
      - "platform/android/java/editor/**"
      - "tools/ai-companion/**"
      - "tools/embedded-runtime/**"
      - ".github/workflows/ai-android.yml"

permissions:
  contents: read

concurrency:
  group: godot-ai-${{ github.ref }}-${{ inputs.distribution || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ziva-preview]') && 'ziva-preview' || 'standard') }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test embedded runtime with upstream Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-ai
          python modules/ai_assistant/tests/run.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64
          python modules/ai_assistant/tests/test_delivery.py
          python modules/ai_assistant/tests/test_termux_blender.py
          python tools/embedded-runtime/test_build.py
          python tools/embedded-runtime/test_rootfs.py
      - name: Render desktop and narrow editor panels
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          python modules/ai_assistant/tests/render.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64
          python modules/ai_assistant/tests/render.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64 --scenario ziva --only narrow --output .ai-qa/rendered/ziva
          python modules/ai_assistant/tests/render.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64 --scenario todo --only narrow --output .ai-qa/rendered/todo
          python modules/ai_assistant/tests/render.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64 --scenario blender --only phone_compact --output .ai-qa/rendered/blender
          python modules/ai_assistant/tests/start.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64 --only narrow --output .ai-qa/rendered/start
          python modules/ai_assistant/tests/render.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64 --scenario generation --only narrow --output .ai-qa/rendered/generation
          python modules/ai_assistant/tests/render.py --godot /tmp/godot-ai/Godot_v4.7.2-stable_linux.x86_64 --scenario chat_lifecycle --only phone_compact --output .ai-qa/rendered/chat-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-editor-rendered-verification
          path: .ai-qa/rendered
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test companion
        working-directory: tools/ai-companion
        run: |
          npm ci
          npm test
          npm run build

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SCONS_CACHE: ${{ github.workspace }}/.ai-scons-cache
      ORG_GRADLE_PROJECT_godotAiDistribution: ${{ inputs.distribution || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ziva-preview]') && 'ziva-preview' || 'standard') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache/restore@v4
        with:
          path: .ai-scons-cache
          key: godot-ai-android-4.7.2-${{ github.sha }}
          restore-keys: godot-ai-android-4.7.2-
      - name: Install build tools
        run: |
          python -m pip install 'scons==4.10.1'
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - name: Restore personal debug signing key
        env:
          AI_DEBUG_KEYSTORE_BASE64: ${{ secrets.GODOT_AI_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$AI_DEBUG_KEYSTORE_BASE64" ]; then
            install -d -m 700 "$HOME/.android"
            printf '%s' "$AI_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "GODOT_AI_DEBUG_KEYSTORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          fi
      - uses: actions/cache@v4
        with:
          path: platform/android/java/editor/build/ai-runtime-build/downloads
          key: godot-runtime-sources-${{ hashFiles('tools/embedded-runtime/sources.json') }}
      - name: Compile editor and APK
        run: |
          scons platform=android target=editor arch=arm64 optimize=size debug_symbols=no generate_android_binaries=yes cache_path="$SCONS_CACHE" -j4
          test -f bin/android_editor_builds/android_editor-android-debug.apk
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ai-scons-cache
          key: godot-ai-android-4.7.2-${{ github.sha }}
      - name: Verify APK
        run: |
          APK=bin/android_editor_builds/android_editor-android-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > "$APK.badging.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import subprocess
          import zipfile
          apk = Path('bin/android_editor_builds/android_editor-android-debug.apk')
          metadata = Path(str(apk) + '.badging.txt').read_text()
          distribution = os.environ.get('ORG_GRADLE_PROJECT_godotAiDistribution', 'standard')
          expected_package = 'com.jdscript.godotai.ziva.debug' if distribution == 'ziva-preview' else 'com.jdscript.godotai.debug'
          assert f"package: name='{expected_package}'" in metadata
          with zipfile.ZipFile(apk) as archive:
              abis = {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
              assert abis == {'arm64-v8a'}, abis
              assert 'lib/arm64-v8a/libgodot_android.so' in archive.namelist()
              probe = archive.read('lib/arm64-v8a/libai_runtime_probe.so')
              assert probe[:4] == b'\x7fELF' and probe[4] == 2, 'Missing 64-bit embedded runtime probe'
              assert int.from_bytes(probe[16:18], 'little') == 3, 'Probe must be PIE/ET_DYN'
              assert int.from_bytes(probe[18:20], 'little') == 183, 'Probe must target AArch64'
              import json
              manifest = json.loads(archive.read('assets/godot_ai/embedded/manifest.json'))
              for path, spec in manifest['files'].items():
                  entry = path.replace('jniLibs/', 'lib/', 1) if path.startswith('jniLibs/') else path
                  data = archive.read(entry)
                  assert hashlib.sha256(data).hexdigest() == spec['sha256'], entry
              assert 'lib/arm64-v8a/libai_proot.so' in archive.namelist()
              assert 'lib/arm64-v8a/libai_proot_loader.so' in archive.namelist()
              package = json.loads(archive.read('assets/godot_ai/linux/package.json'))
              rootfs = archive.read('assets/godot_ai/linux/rootfs.zip')
              assert len(rootfs) == package['size'] and hashlib.sha256(rootfs).hexdigest() == package['sha256'], 'Linux filesystem differs from package manifest'
              lock = json.loads(Path('tools/embedded-runtime/rootfs.json').read_text())
              assert package['source_sha256'] == lock['sha256'], 'Unexpected Debian base'
              dex = b''.join(archive.read(name) for name in archive.namelist() if name.endswith('.dex'))
              for component in ['AILinuxRuntime', 'AILinuxRuntimeService', 'AILinuxRuntimeFiles', 'AIZivaRuntime', 'AIZivaService', 'AIZivaWindow', 'AIZivaPackage', 'AIZivaGodot', 'AIZivaDependencies', 'AIZivaSession', 'AIZivaUpdates']:
                  assert ('Lorg/godotengine/editor/' + component + ';').encode() in dex, component
              library = archive.read('lib/arm64-v8a/libgodot_android.so')
              assert b'AIAssistantEditorPlugin' in library, 'AI editor module missing'
              for source in Path('modules/ai_assistant/runtime').glob('*.gd'):
                  assert source.read_bytes() + b'\x00' in library, 'Embedded script differs: ' + source.name
          if os.environ.get('GODOT_AI_DEBUG_KEYSTORE_FILE'):
              certificate = subprocess.run(['keytool', '-exportcert', '-keystore', os.environ['GODOT_AI_DEBUG_KEYSTORE_FILE'], '-storepass', 'android', '-alias', 'androiddebugkey'], check=True, capture_output=True).stdout
              expected = hashlib.sha256(certificate).hexdigest()
              signer = str(Path(os.environ['ANDROID_HOME']) / 'build-tools/36.1.0/apksigner')
              actual = subprocess.run([signer, 'verify', '--print-certs', str(apk)], check=True, capture_output=True, text=True).stdout
              assert f'certificate SHA-256 digest: {expected}' in actual, 'Unexpected APK signing identity'
              print('Verified persistent personal debug signing certificate: ' + expected)
          print(metadata.splitlines()[0])
          print('Verified arm64 native libraries and Android phone/tablet package.')
          PY
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-AI-${{ (inputs.distribution || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ziva-preview]') && 'ziva-preview' || 'standard')) == 'ziva-preview' && 'Ziva' || 'Android' }}-arm64-${{ github.sha }}
          path: |
            bin/android_editor_builds/android_editor-android-debug.apk
            bin/android_editor_builds/android_editor-android-debug.apk.sha256
            bin/android_editor_builds/android_editor-android-debug.apk.badging.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Godot-embedded-runtime-sources-${{ github.sha }}
          path: platform/android/java/editor/build/generated/ai-runtime/corresponding-sources.tar.gz
          if-no-files-found: error

  native-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SCONS_CACHE: ${{ github.workspace }}/.ai-linux-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .ai-linux-cache
          key: godot-ai-linux-4.7.2-${{ github.sha }}
          restore-keys: godot-ai-linux-4.7.2-
      - name: Install native editor build tools
        run: |
          python -m pip install 'scons==4.10.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libxi-dev libxrandr-dev xvfb
      - name: Compile the fork's desktop editor
        run: scons platform=linuxbsd target=editor arch=x86_64 optimize=size debug_symbols=no wayland=no speechd=no cache_path="$SCONS_CACHE" -j4
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ai-linux-cache
          key: godot-ai-linux-4.7.2-${{ github.sha }}
      - name: Exercise and render the actual native plugin
        run: |
          python modules/ai_assistant/tests/render.py --godot "$PWD/bin/godot.linuxbsd.editor.x86_64" --output .ai-qa/native-rendered
          python modules/ai_assistant/tests/render.py --godot "$PWD/bin/godot.linuxbsd.editor.x86_64" --scenario todo --only narrow --output .ai-qa/native-rendered/todo
          python modules/ai_assistant/tests/render.py --godot "$PWD/bin/godot.linuxbsd.editor.x86_64" --scenario panels --only phone_landscape --output .ai-qa/native-rendered/panels
          python modules/ai_assistant/tests/start.py --godot "$PWD/bin/godot.linuxbsd.editor.x86_64" --only narrow --output .ai-qa/native-rendered/start
          python modules/ai_assistant/tests/render.py --godot "$PWD/bin/godot.linuxbsd.editor.x86_64" --scenario generation --only phone_landscape --output .ai-qa/native-rendered/generation
          python modules/ai_assistant/tests/render.py --godot "$PWD/bin/godot.linuxbsd.editor.x86_64" --scenario panel_access --only narrow --output .ai-qa/native-rendered/panel-access
          python modules/ai_assistant/tests/render.py --godot "$PWD/bin/godot.linuxbsd.editor.x86_64" --scenario chat_lifecycle --only phone_compact --output .ai-qa/native-rendered/chat-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-native-editor-verification
          path: |
            .ai-qa/native-rendered
            bin/godot.linuxbsd.editor.x86_64
          if-no-files-found: warn
